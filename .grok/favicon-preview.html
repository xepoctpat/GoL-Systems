<!doctype html>
<html><head><style>
  html,body{margin:0;background:#333;display:flex;gap:16px;align-items:center;justify-content:center;height:100vh}
  .row{display:flex;gap:24px;align-items:flex-end}
  figure{margin:0;text-align:center;color:#ccc;font:12px sans-serif}
  img.s16{width:16px;height:16px;image-rendering:pixelated;background:#fff}
  img.s32{width:32px;height:32px;image-rendering:pixelated;background:#fff}
  img.s64{width:64px;height:64px;background:#fff}
</style></head>
<body>
  <div class="row">
    <figure><img class="s16" src="file:///workspace/public/favicon.svg"><figcaption>16</figcaption></figure>
    <figure><img class="s32" src="file:///workspace/public/favicon.svg"><figcaption>32</figcaption></figure>
    <figure><img class="s64" src="file:///workspace/public/favicon.svg"><figcaption>64</figcaption></figure>
  </div>
</body></html>
